services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: tester
      POSTGRES_DB: tester
    ports:
      # Host 55432, not 5432 — this machine already has an unrelated
      # postgres container bound to the default port.
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tester -d tester']
      interval: 2s
      timeout: 3s
      retries: 15
